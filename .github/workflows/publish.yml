name: publish

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'alanyz106/dsh-persona-memory'
    permissions:
      contents: write
      # npm Trusted Publishing: the publish step exchanges this OIDC token for
      # a short-lived npm credential, so no NPM_TOKEN secret is needed.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        # devDeps carry every @deepseek-ai package the TYPECHECK needs
        # (dsh-agent augments cordis Context with systemPrompt; dsh-tools needs
        # its own peer chain present at runtime for the smoke test imports).
        # --legacy-peer-deps: dsh-session 0.2.1-rc.x pins dsh-scope EXACTLY,
        # which conflicts with the ^0.1.0-rc.x peers of the client-runtime
        # peer chain — the plugin resolves all @deepseek-ai/* from the HOST
        # dsh install at real runtime, so this pin conflict only ever affects
        # the CI type/test environment.
        # --no-package-lock: the repo installs through pnpm (dsh plugin add);
        # a committed npm lock would freeze the resolution CI wants loose.
        # --ignore-scripts: @xenova/transformers pulls in sharp, whose native
        # libvips download is flaky on CI and irrelevant to the smoke tests
        # (embedding is a dynamic import; vector search falls back to FTS5).
        run: npm install --legacy-peer-deps --no-package-lock --ignore-scripts

      - name: Build (TypeScript → dist + client bundle)
        run: npm run build

      - name: Run smoke tests
        run: node test/smoke.mjs

      - name: Check version changed
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view @alanyz106/dsh-persona-memory version 2>/dev/null || echo "0.0.0")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish registry
        # No registry-url on setup-node: it would write an .npmrc auth placeholder
        # that expects NODE_AUTH_TOKEN, and trusted publishing authenticates via
        # OIDC instead.
        run: npm config set registry https://registry.npmjs.org

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        # --access public is required for a scoped package to be installable
        # without a paid plan.
        run: npm publish --provenance --access public

      - name: Tag release
        if: steps.version.outputs.changed == 'true'
        run: |
          TAG="v${{ steps.version.outputs.local }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "tag $TAG already exists remotely — skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
